@let t = i18n.t();

<button class="lang-btn" type="button" [attr.aria-label]="t.lang.toggleAria" (click)="switch()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9" />
        <path d="M3 12h18" />
        <path d="M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18z" />
    </svg>
    <!-- lang = the label's own language, so screen readers pronounce it correctly -->
    <span class="lang-label" [attr.lang]="targetLang()">{{ t.lang.toggleLabel }}</span>
</button>
