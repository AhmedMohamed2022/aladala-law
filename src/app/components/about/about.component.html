@let t = i18n.t();

<section #root id="about" class="about section">
    <div class="container grid">
        <!-- First grid column stays empty: the 3D scale lands here -->
        <div class="spacer" aria-hidden="true"></div>

        <div class="content">
            <span class="eyebrow text-item reveal">{{ t.about.eyebrow }}</span>

            <h2 class="title text-item reveal">{{ t.about.title.before }}<span class="gold-text">{{ t.about.title.accent
                    }}</span>@if (t.about.title.after) {<br />{{ t.about.title.after }}}</h2>

            @for (p of t.about.paragraphs; track $index) {
            <p class="lead text-item reveal">{{ p }}</p>
            }

            <div class="rule" aria-hidden="true"></div>

            <ul class="stats">
                @for (s of stats; track s.key) {
                <li class="stat reveal">
                    <strong>
                        <!-- Text is written by the component (see about.component.ts) -->
                        <span class="num"></span><span class="suffix">{{ s.suffix }}</span>
                    </strong>
                    <span class="label">{{ t.about.stats[s.key] }}</span>
                </li>
                }
            </ul>
        </div>
    </div>
</section>
