@let t = i18n.t();

<!-- Screen-reader announcement after a language switch -->
<p class="sr-only" aria-live="polite" aria-atomic="true">{{ transition.announcement() }}</p>

<header #header class="header">
    <div class="container bar">
        <a class="brand" href="#" (click)="goTo($event, '#hero')" [attr.aria-label]="t.brand.fullName">
            <svg class="brand-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="24" y1="8" x2="24" y2="38" />
                <line x1="14" y1="40" x2="34" y2="40" />
                <line x1="8" y1="14" x2="40" y2="14" />
                <path d="M8 14 L3 26 H13 Z" />
                <path d="M40 14 L35 26 H45 Z" />
            </svg>
            <span class="brand-text" data-lang-fade>
                <strong>{{ t.brand.name }}</strong>
                <small>{{ t.brand.tagline }}</small>
            </span>
        </a>

        <nav class="desktop-nav" data-lang-fade [attr.aria-label]="t.aria.mainNav">
            @for (link of links; track link.target) {
            <a [href]="link.target" (click)="goTo($event, link.target)">{{ t.nav[link.key] }}</a>
            }
        </nav>

        <div class="bar-end">
            <app-lang-toggle />
            <a class="btn btn-gold cta" href="#contact" data-lang-fade (click)="goTo($event, '#contact')">{{ t.nav.cta
                }}</a>
        </div>

        <button class="burger" type="button" [class.open]="menuOpen()" [attr.aria-expanded]="menuOpen()"
            aria-controls="mobile-menu" [attr.aria-label]="t.aria.menu" (click)="toggleMenu()">
            <span></span>
            <span></span>
        </button>
    </div>
</header>

<!-- Sibling of the header on purpose (see note above) -->
<div id="mobile-menu" class="panel" [class.open]="menuOpen()" [attr.aria-hidden]="!menuOpen()">
    <nav class="panel-nav" data-lang-fade [attr.aria-label]="t.aria.mobileNav">
        @for (link of links; track link.target; let i = $index) {
        <a [href]="link.target" [style.transition-delay]="menuOpen() ? 120 + i * 70 + 'ms' : '0ms'"
            [attr.tabindex]="menuOpen() ? 0 : -1" (click)="goTo($event, link.target)">
            <span class="num">{{ i18n.pad2(i + 1) }}</span>
            {{ t.nav[link.key] }}
        </a>
        }
        <a class="btn btn-gold panel-cta" href="#contact"
            [style.transition-delay]="menuOpen() ? 120 + links.length * 70 + 'ms' : '0ms'"
            [attr.tabindex]="menuOpen() ? 0 : -1" (click)="goTo($event, '#contact')">{{ t.nav.cta }}</a>
    </nav>

    <div class="panel-lang">
        <app-lang-toggle />
    </div>
</div>
