@let t = i18n.t();

<footer class="footer">
    <div class="container wrap">
        <div class="brand">
            <strong>{{ t.brand.name }}</strong>
            <small>{{ t.brand.tagline }}</small>
        </div>

        <nav class="links" [attr.aria-label]="t.aria.footerNav">
            @for (link of links; track link.target) {
            <a [href]="link.target" (click)="goTo($event, link.target)">{{ t.nav[link.key] }}</a>
            }
        </nav>

        <button class="top" type="button" [attr.aria-label]="t.aria.backToTop" (click)="goTo($event, '#hero')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <path d="M12 19V5" />
                <path d="m5 12 7-7 7 7" />
            </svg>
        </button>
    </div>

    <div class="container legal">
        <p>© {{ i18n.digits(year.toString()) }} {{ t.footer.rights }}</p>
        <p class="note">{{ t.footer.note }}</p>
    </div>
</footer>
