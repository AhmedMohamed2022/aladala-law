<section #root id="hero" class="hero">
    <div class="container">
        <div class="content" data-hero-content>
            <span class="eyebrow reveal">مكتب محاماة واستشارات قانونية</span>

            <h1 class="headline">
                <span class="line"><span class="line-inner reveal">نصنع الثقة..</span></span>
                <span class="line"><span class="line-inner reveal gold-text">وندافع عن الحقوق</span></span>
            </h1>

            <p class="lead reveal">
                نقدّم حلولاً قانونية استراتيجية للشركات والأفراد، بخبرة راسخة وسرّية تامة،
                وبفهم عميق لتفاصيل كل قضية، لنحمي مصالحكم ونصون حقوقكم في كل مرحلة.
            </p>

            <div class="actions">
                <a class="btn btn-gold reveal" href="#contact" (click)="goTo($event, '#contact')">احجز استشارتك</a>
                <a class="btn btn-ghost reveal" href="#services" (click)="goTo($event, '#services')">اكتشف خدماتنا</a>
            </div>
        </div>
    </div>

    <div class="scroll-cue" aria-hidden="true">
        <span>اسحب للأسفل</span>
        <i></i>
    </div>
</section>
