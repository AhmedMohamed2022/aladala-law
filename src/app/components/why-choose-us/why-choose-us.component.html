@let t = i18n.t();

<section #root id="why" class="why section">
    <div class="container grid">
        <div class="content">
            <div class="head">
                <span class="eyebrow head-item reveal">{{ t.why.eyebrow }}</span>
                <h2 class="title head-item reveal">{{ t.why.title.before }}<span class="gold-text">{{ t.why.title.accent
                        }}</span>@if (t.why.title.after) {<br />{{ t.why.title.after }}}</h2>
            </div>

            <ol class="timeline">
                <!-- Track (faint) and fill (gold, scrubbed by scroll) -->
                <span class="line-track" aria-hidden="true"></span>
                <span class="line-fill" aria-hidden="true"></span>

                @for (p of t.why.pillars; track $index; let i = $index) {
                <li class="item">
                    <span class="node" aria-hidden="true"></span>
                    <div class="item-body reveal">
                        <span class="item-num" aria-hidden="true">{{ i18n.pad2(i + 1) }}</span>
                        <h3>{{ p.title }}</h3>
                        <p>{{ p.text }}</p>
                    </div>
                </li>
                }
            </ol>
        </div>

        <!-- Second column stays empty: the 3D scale lands here -->
        <div class="spacer" aria-hidden="true"></div>
    </div>
</section>
