<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <!-- Sets lang/dir from the saved preference BEFORE first paint (no RTL flash for English visitors).
     The storage key must match STORAGE_KEY in language.service.ts -->
  <script>
    (function () {
      try {
        var l = localStorage.getItem('aladala.lang') === 'en' ? 'en' : 'ar';
        var h = document.documentElement;
        h.lang = l;
        h.dir = l === 'ar' ? 'rtl' : 'ltr';
      } catch (e) { /* storage blocked: keep the Arabic defaults */ }
    })();
  </script>
  <title>مكتب العدالة للمحاماة | نصنع الثقة.. وندافع عن الحقوق</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="مكتب محاماة متميز يقدم حلولاً قانونية استراتيجية للشركات والأفراد.">
  <meta name="theme-color" content="#0a1220">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Tajawal:wght@300;400;500;700&display=swap"
    rel="stylesheet">
</head>

<body>
  <app-root></app-root>
</body>

</html>
